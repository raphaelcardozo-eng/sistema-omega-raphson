<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<style>
:root{
  --bg:#0d1117;--sb:#161b22;--card:#1c2230;--card2:#212936;
  --border:#2a3245;--primary:#2563eb;--pl:#3b82f6;
  --gold:#d4a017;--gl:#f0c040;
  --text:#e6edf3;--muted:#8b949e;
  --green:#22c55e;--warn:#f59e0b;--red:#ef4444;--purple:#a78bfa;
  --r:8px;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,sans-serif;}
body{background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden;}

/* TOPBAR */
.topbar{background:var(--sb);border-bottom:1px solid var(--border);padding:0 24px;height:52px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.brand{font-size:14px;font-weight:800;color:var(--gold);}
.brand span{color:var(--pl);}
.db-status{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);}
.db-dot{width:8px;height:8px;border-radius:50%;background:var(--warn);}

/* TAB NAV */
.tabnav{background:var(--sb);border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:flex-end;gap:2px;flex-shrink:0;}
.tab{padding:12px 18px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;display:flex;align-items:center;gap:7px;white-space:nowrap;}
.tab:hover{color:var(--text);}
.tab.active{color:var(--pl);border-bottom-color:var(--primary);}
.tab .tc{font-size:10px;background:var(--border);color:var(--muted);padding:1px 6px;border-radius:10px;}
.tab.active .tc{background:rgba(37,99,235,.3);color:var(--pl);}

/* TOOLBAR */
.toolbar{padding:14px 24px;display:flex;align-items:center;gap:10px;flex-shrink:0;background:var(--bg);}
.search-wrap{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:8px 14px;flex:1;max-width:380px;}
.search-wrap input{background:none;border:none;outline:none;color:var(--text);font-size:13px;width:100%;}
.search-wrap input::placeholder{color:var(--muted);}
.flt{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:7px 12px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px;}
.flt select{background:none;border:none;outline:none;color:var(--muted);font-size:12px;cursor:pointer;}
.flt select option{background:var(--card2);color:var(--text);}
.add-btn{margin-left:auto;background:linear-gradient(135deg,var(--primary),#1d4ed8);border:none;border-radius:var(--r);padding:9px 18px;color:#fff;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;}
.results-info{font-size:12px;color:var(--muted);padding:0 24px 10px;}

/* TABLE */
.table-wrap{flex:1;overflow:auto;padding:0 24px 24px;}
table{width:100%;border-collapse:collapse;font-size:13px;}
thead tr{background:var(--card);position:sticky;top:0;z-index:2;}
thead th{padding:11px 14px;text-align:left;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;border-bottom:1px solid var(--border);white-space:nowrap;}
thead th:first-child{border-radius:var(--r) 0 0 0;}
thead th:last-child{border-radius:0 var(--r) 0 0;}
tbody tr{border-bottom:1px solid var(--border);transition:background .1s;cursor:pointer;}
tbody tr:hover{background:rgba(255,255,255,.03);}
tbody td{padding:12px 14px;vertical-align:middle;}
.cell-main{font-weight:600;color:var(--text);}
.cell-sub{font-size:11px;color:var(--muted);margin-top:2px;}
.av-sm{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex-shrink:0;}
.cell-with-av{display:flex;align-items:center;gap:10px;}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;}
.status-pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;}
.sdot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.actions{display:flex;gap:6px;opacity:0;transition:opacity .15s;}
tbody tr:hover .actions{opacity:1;}
.act-btn{background:var(--card2);border:1px solid var(--border);border-radius:6px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;}
.act-btn:hover{border-color:var(--primary);}
.empty-row td{text-align:center;padding:60px;color:var(--muted);}
.empty-ico{font-size:32px;opacity:.2;margin-bottom:8px;}

/* SPIN */
.spin{width:12px;height:12px;border:2px solid var(--border);border-top-color:var(--pl);border-radius:50%;animation:spin .7s linear infinite;display:none;}
.spin.on{display:inline-block;}
@keyframes spin{to{transform:rotate(360deg)}}

/* DETAIL PANEL */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none;}
.ov.open{display:block;}
.dp{position:fixed;top:0;right:0;width:420px;height:100vh;background:var(--sb);border-left:1px solid var(--border);overflow-y:auto;z-index:51;transform:translateX(100%);transition:transform .22s ease;}
.dp.open{transform:none;}
.dp-hd{padding:20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;}
.dp-av{width:48px;height:48px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;flex-shrink:0;}
.dp-name{font-size:16px;font-weight:800;}
.dp-sub{font-size:12px;color:var(--muted);margin-top:2px;}
.cls{margin-left:auto;background:var(--card);border:1px solid var(--border);border-radius:7px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;flex-shrink:0;}
.dp-sec{padding:14px 20px;border-bottom:1px solid var(--border);}
.dp-sec-t{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:10px;}
.dp-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;}
.dp-f{margin-bottom:10px;}
.dp-f label{font-size:10px;color:var(--muted);display:block;margin-bottom:2px;}
.dp-f span{font-size:13px;}
.hi{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);}
.hi:last-child{border:none;}
.hdot{width:7px;height:7px;border-radius:50%;margin-top:5px;flex-shrink:0;}
.ht{font-size:13px;}

/* MODAL */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:60;display:none;align-items:center;justify-content:center;}
.modal-ov.open{display:flex;}
.modal{background:var(--sb);border:1px solid var(--border);border-radius:14px;width:560px;max-height:88vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5);}
.modal-hd{padding:20px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-shrink:0;}
.modal-ico{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
.modal-title{font-size:15px;font-weight:800;}
.modal-sub{font-size:12px;color:var(--muted);margin-top:1px;}
.modal-body{overflow-y:auto;padding:20px 22px;flex:1;}
.modal-ft{padding:14px 22px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end;flex-shrink:0;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
.form-grid.full{grid-template-columns:1fr;}
.f-group{display:flex;flex-direction:column;gap:5px;}
.f-group label{font-size:11px;color:var(--muted);font-weight:600;}
.req{color:var(--red);margin-left:2px;}
.f-input,.f-select{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:9px 12px;color:var(--text);font-size:13px;outline:none;transition:border .15s;width:100%;}
.f-input:focus,.f-select:focus{border-color:var(--primary);}
.f-input::placeholder{color:var(--muted);}
.f-select option{background:var(--card2);}
.f-input.err,.f-select.err{border-color:var(--red);}
.sec-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;margin:4px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--border);}
.btn-cancel{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:9px 18px;color:var(--muted);font-size:13px;cursor:pointer;}
.btn-save{background:linear-gradient(135deg,var(--primary),#1d4ed8);border:none;border-radius:var(--r);padding:9px 22px;color:#fff;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px;}
.btn-save:disabled{opacity:.5;cursor:not-allowed;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 20px;font-size:13px;font-weight:600;z-index:100;transition:transform .3s;display:flex;align-items:center;gap:8px;box-shadow:0 8px 30px rgba(0,0,0,.4);}
.toast.show{transform:translateX(-50%) translateY(0);}
.toast.success{border-color:var(--green);color:var(--green);}
.toast.error{border-color:var(--red);color:var(--red);}
::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
</style>
</head>

        {id:'estoque_minimo',label:'Estoque Mínimo',type:'number',placeholder:'0'},
        {id:'fornecedor',label:'Fornecedor',type:'text',placeholder:'Nome do fornecedor'},
        {id:'ultima_compra',label:'Última Compra',type:'date'},
        {id:'spe_label',label:'Local',type:'select',options:['HQ','SPE 01','SPE 02','SPE 03','SPE 04']},
      ]},
      {title:'Status',fields:[
        {id:'status',label:'Status',type:'select',req:true,options:['Estoque OK','Estoque Baixo','Sem Estoque']},
      ]},
    ]
  },
  fornecedores:{label:'Fornecedor',ico:'🏢',accent:'#d4a017',table:'fornecedores',
    sections:[
      {title:'Dados da Empresa',fields:[
        {id:'nome',label:'Razão Social',type:'text',req:true,placeholder:'Ex: Construtora XYZ Ltda',span:2},
        {id:'cnpj',label:'CNPJ',type:'text',placeholder:'00.000.000/0001-00'},
        {id:'categoria',label:'Categoria',type:'select',options:['Construção Civil','Consultoria','Materiais','Arquitetura','Limpeza','Segurança','Tecnologia','Transporte','Contabilidade','Jurídico','Outro']},
        {id:'responsavel',label:'Responsável',type:'text',placeholder:'Nome do contato'},
        {id:'email',label:'E-mail',type:'email',placeholder:'email@empresa.com'},
        {id:'telefone',label:'Telefone',type:'text',placeholder:'(21) 99999-0000'},
        {id:'spes_atendidas',label:'SPEs Atendidas',type:'select',options:['Todas','SPE 01','SPE 02','SPE 03','SPE 04','HQ']},
      ]},
      {title:'Status',fields:[
        {id:'status',label:'Status',type:'select',req:true,options:['Ativo','Inativo']},
      ]},
    ]
  },
};

const ACCENT = {funcionarios:'#2563eb',spes:'#3b82f6',stands:'#f59e0b',inventario:'#a78bfa',almoxarifado:'#22c55e',fornecedores:'#d4a017'};
const sColor = s=>({'Ativo':'#22c55e','Inativo':'#ef4444','Férias':'#f59e0b','Desligado':'#ef4444','Em Análise':'#f59e0b','Aguardando':'#a78bfa','Em Obra':'#f59e0b','Lançamento':'#3b82f6','Planejamento':'#a78bfa','Em Uso':'#22c55e','Disponível':'#22c55e','Estoque OK':'#22c55e','Estoque Baixo':'#ef4444','Sem Estoque':'#ef4444','Em Manutenção':'#f59e0b','Em Montagem':'#f59e0b','Em Reforma':'#f59e0b','Entregue':'#22c55e','Encerrada':'#8b949e','Baixado':'#8b949e'}[s]||'#8b949e');
function ini(n){if(!n)return'?';const p=n.trim().split(' ');return p.length>=2?(p[0][0]+p[1][0]).toUpperCase():n.slice(0,2).toUpperCase();}

let DB={};
let currentTab='funcionarios';
let currentModalTab='funcionarios';
let editingId=null;

async function sbFetch(table){
  const r=await fetch(`${SB_URL}/rest/v1/${table}?select=*&order=created_at.desc`,{
    headers:{'apikey':SB_KEY,'Authorization':`Bearer ${SB_KEY}`,'Content-Type':'application/json'}
  });
  if(!r.ok) throw new Error(table);
  return r.json();
}

async function loadAll(){
  document.getElementById('spin').classList.add('on');
  try{
    const tabs=Object.keys(TAB_TABLE);
    const res=await Promise.all(tabs.map(t=>sbFetch(TAB_TABLE[t]).then(d=>({t,d}))));
    res.forEach(({t,d})=>{ DB[t]=d; });
    document.getElementById('db-dot').style.background='var(--green)';
    document.getElementById('db-lbl').textContent='Supabase · Conectado';
    updateCounts();
    render();
  } catch(e){
    document.getElementById('db-dot').style.background='var(--red)';
    document.getElementById('db-lbl').textContent='Erro de conexão';
    document.getElementById('results-lbl').textContent='Erro ao carregar.';
  }
  document.getElementById('spin').classList.remove('on');
}

function updateCounts(){
  Object.keys(TAB_TABLE).forEach(t=>{
    const el=document.getElementById('tc-'+t);
    if(el) el.textContent=(DB[t]||[]).length;
  });
}

function switchTab(el){
  currentTab=el.dataset.tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('s-input').value='';
  document.getElementById('f-status').value='';
  document.getElementById('f-spe').value='';
  render();
}

function render(){
  const q=document.getElementById('s-input').value.toLowerCase();
  const fSt=document.getElementById('f-status').value;
  const fSpe=document.getElementById('f-spe').value;
  let recs=(DB[currentTab]||[]);
  if(q) recs=recs.filter(r=>Object.values(r).some(v=>v&&String(v).toLowerCase().includes(q)));
  if(fSt) recs=recs.filter(r=>r.status===fSt);
  if(fSpe) recs=recs.filter(r=>{const s=(r.spe_label||r.spes_atendidas||'').toLowerCase();return s.includes(fSpe.toLowerCase())||s.includes('todas');});

  document.getElementById('results-lbl').textContent=`${recs.length} registro${recs.length!==1?'s':''} encontrado${recs.length!==1?'s':''}`;

  const cols=COLS[currentTab]||[];
  const ac=ACCENT[currentTab]||'var(--primary)';

  // Header
  document.getElementById('tbl-head').innerHTML=`<tr>${cols.map(c=>`<th>${c.label}</th>`).join('')}</tr>`;

  // Body
  const tbody=document.getElementById('tbl-body');
  if(!recs.length){
    tbody.innerHTML=`<tr class="empty-row"><td colspan="${cols.length}"><div class="empty-ico">🗂️</div><div>Nenhum registro encontrado</div></td></tr>`;
    return;
  }

  tbody.innerHTML=recs.map(r=>{
    const cells=cols.map(c=>{
      if(c.type==='status'){
        const sc=sColor(r.status);
        return`<td><span class="status-pill"><span class="sdot" style="background:${sc}"></span><span style="color:${sc}">${r.status||'—'}</span></span></td>`;
      }
      if(c.type==='actions'){
        return`<td><div class="actions"><div class="act-btn" onclick="event.stopPropagation();openDP('${r.id}')">👁</div><div class="act-btn" onclick="event.stopPropagation();editRecord('${r.id}')">✏️</div><div class="act-btn" onclick="event.stopPropagation();deleteRecord('${r.id}')">🗑</div></div></td>`;
      }
      if(c.main){
        return`<td><div class="cell-with-av"><div class="av-sm" style="background:${ac}20;color:${ac}">${ini(r[c.key]||'')}</div><div><div class="cell-main">${r[c.key]||'—'}</div></div></div></td>`;
      }
      return`<td><span style="color:var(--text)">${r[c.key]??'—'}</span></td>`;
    });
    return`<tr onclick="openDP('${r.id}')">${cells.join('')}</tr>`;
  }).join('');
}

function openDP(id){
  const r=(DB[currentTab]||[]).find(x=>x.id===id);
  if(!r) return;
  const ac=ACCENT[currentTab]||'#2563eb';
  const sC=sColor(r.status);
  document.getElementById('dp-av').style.cssText=`background:${ac}20;color:${ac}`;
  document.getElementById('dp-av').textContent=ini(r.nome||r.codigo||'?');
  document.getElementById('dp-name').textContent=r.nome||r.codigo||'—';
  document.getElementById('dp-sub').innerHTML=`<span class="tag" style="background:${sC}20;color:${sC}">${r.status||'—'}</span>`;
  const skip=['id','tags','historico','docs','created_at','updated_at'];
  const fields=Object.entries(r).filter(([k])=>!skip.includes(k)&&r[k]!==null&&r[k]!=='');
  const hist=Array.isArray(r.historico)?r.historico:[];
  const hc=['#2563eb','#d4a017','#22c55e','#a78bfa'];
  let b=`<div class="dp-sec"><div class="dp-sec-t">Dados Cadastrais</div><div class="dp-grid">`;
  fields.forEach(([k,v])=>{b+=`<div class="dp-f"><label>${k.replace(/_/g,' ')}</label><span>${v}</span></div>`;});
  b+=`</div></div>`;
  if(hist.length){
    b+=`<div class="dp-sec"><div class="dp-sec-t">Histórico</div>`;
    hist.forEach((h,i)=>{b+=`<div class="hi"><div class="hdot" style="background:${hc[i%4]}"></div><div class="ht">${h.t||h}</div></div>`;});
    b+=`</div>`;
  }
  document.getElementById('dp-body').innerHTML=b;
  document.getElementById('ov').classList.add('open');
  document.getElementById('dp').classList.add('open');
}

function closeDP(){document.getElementById('ov').classList.remove('open');document.getElementById('dp').classList.remove('open');}

function openModal(){
  editingId=null;
  currentModalTab=currentTab;
  buildModal(null);
  document.getElementById('modal-ov').classList.add('open');
}

function editRecord(id){
  const r=(DB[currentTab]||[]).find(x=>x.id===id);
  if(!r) return;
  editingId=id;
  currentModalTab=currentTab;
  buildModal(r);
  document.getElementById('modal-ov').classList.add('open');
}

function buildModal(data){
  const f=FORMS[currentModalTab];
  if(!f) return;
  const isEdit=!!data;
  document.getElementById('m-ico').style.cssText=`background:${f.accent}20;color:${f.accent}`;
  document.getElementById('m-ico').textContent=f.ico;
  document.getElementById('m-title').textContent=isEdit?`Editar ${f.label}`:`Novo ${f.label}`;
  document.getElementById('m-sub').textContent=isEdit?'Atualize os dados abaixo':'Preencha os dados abaixo';
  document.getElementById('btn-save').innerHTML=`<span class="spin" id="save-spin"></span>${isEdit?'Salvar Alterações':'Salvar'}`;
  let html='';
  f.sections.forEach(sec=>{
    html+=`<div class="sec-lbl">${sec.title}</div><div class="form-grid">`;
    sec.fields.forEach(fld=>{
      const span=fld.span===2?'grid-column:span 2':'';
      const val=data?.(data[fld.id]??''):'';
      if(fld.type==='select'){
        const opts=(fld.options||[]).map(o=>`<option ${data&&data[fld.id]===o?'selected':''}>${o}</option>`).join('');
        html+=`<div class="f-group" style="${span}"><label>${fld.label}${fld.req?`<span class="req">*</span>`:''}</label><select class="f-select" id="f_${fld.id}"><option value="">Selecione...</option>${opts}</select></div>`;
      } else {
        html+=`<div class="f-group" style="${span}"><label>${fld.label}${fld.req?`<span class="req">*</span>`:''}</label><input class="f-input" id="f_${fld.id}" type="${fld.type}" placeholder="${fld.placeholder||''}" value="${data&&data[fld.id]!=null?data[fld.id]:''}"/></div>`;
      }
    });
    html+=`</div>`;
  });
  document.getElementById('m-body').innerHTML=html;
}

function closeModal(){document.getElementById('modal-ov').classList.remove('open');}

async function saveRecord(){
  const f=FORMS[currentModalTab];
  if(!f) return;
  const allFields=f.sections.flatMap(s=>s.fields);
  let valid=true;
  allFields.forEach(fld=>{
    const el=document.getElementById('f_'+fld.id);
    if(!el) return;
    el.classList.remove('err');
    if(fld.req&&!el.value.trim()){el.classList.add('err');valid=false;}
  });
  if(!valid){showToast('Preencha os campos obrigatórios','error');return;}

  const payload={};
  allFields.forEach(fld=>{
    const el=document.getElementById('f_'+fld.id);
    if(!el) return;
    if(el.value!=='') payload[fld.id]=fld.type==='number'?parseFloat(el.value)||0:el.value;
  });

  const btn=document.getElementById('btn-save');
  const sp=document.getElementById('save-spin');
  btn.disabled=true;sp.classList.add('on');

  try{
    let saved;
    if(editingId){
      // UPDATE
      payload.updated_at=new Date().toISOString();
      const existing=DB[currentModalTab].find(x=>x.id===editingId);
      const hist=Array.isArray(existing?.historico)?existing.historico:[];
      payload.historico=[{t:`Editado em ${new Date().toLocaleDateString('pt-BR')}`},...hist];
      const r=await fetch(`${SB_URL}/rest/v1/${f.table}?id=eq.${editingId}`,{
        method:'PATCH',
        headers:{'apikey':SB_KEY,'Authorization':`Bearer ${SB_KEY}`,'Content-Type':'application/json','Prefer':'return=representation'},
        body:JSON.stringify(payload)
      });
      if(!r.ok){const e=await r.json();throw new Error(e.message||'Erro');}
      [saved]=await r.json();
      DB[currentModalTab]=DB[currentModalTab].map(x=>x.id===editingId?saved:x);
      showToast(`✅ ${f.label} atualizado com sucesso!`,'success');
    } else {
      // INSERT
      payload.tags=[];
      payload.historico=[{t:`Cadastrado em ${new Date().toLocaleDateString('pt-BR')}`}];
      payload.docs=[];
      const r=await fetch(`${SB_URL}/rest/v1/${f.table}`,{
        method:'POST',
        headers:{'apikey':SB_KEY,'Authorization':`Bearer ${SB_KEY}`,'Content-Type':'application/json','Prefer':'return=representation'},
        body:JSON.stringify(payload)
      });
      if(!r.ok){const e=await r.json();throw new Error(e.message||'Erro');}
      [saved]=await r.json();
      DB[currentModalTab]=[saved,...(DB[currentModalTab]||[])];
      showToast(`✅ ${f.label} cadastrado com sucesso!`,'success');
    }
    updateCounts();render();closeModal();
  } catch(e){showToast(`Erro: ${e.message}`,'error');}
  btn.disabled=false;sp.classList.remove('on');
}

async function deleteRecord(id){
  if(!confirm('Confirma a exclusão deste registro?')) return;
  const table=TAB_TABLE[currentTab];
  const r=await fetch(`${SB_URL}/rest/v1/${table}?id=eq.${id}`,{
    method:'DELETE',
    headers:{'apikey':SB_KEY,'Authorization':`Bearer ${SB_KEY}`}
  });
  if(r.ok){
    DB[currentTab]=DB[currentTab].filter(x=>x.id!==id);
    updateCounts();render();
    showToast('Registro excluído','success');
  } else showToast('Erro ao excluir','error');
}

function editRecord(id){
  openDP(id);
  showToast('Edição em desenvolvimento','error');
}

function showToast(msg,type='success'){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className=`toast ${type}`;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3500);
}

loadAll();
</script>
</body>
</html>
